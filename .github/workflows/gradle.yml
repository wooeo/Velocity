name: Build and Release Velocity

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: ./gradlew clean shadowJar

      - name: Find and rename JAR
        id: prepare_jar
        run: |
          # 找到主JAR文件（排除sources和javadoc）
          JAR_PATH=$(ls proxy/build/libs/*.jar | grep -v "sources" | grep -v "javadoc" | head -n 1)
          # 复制并重命名为velocity.jar
          cp "$JAR_PATH" velocity.jar
          echo "jar_name=velocity.jar" >> $GITHUB_OUTPUT
          echo "original_name=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-artifact
          path: velocity.jar

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: velocity-artifact

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "velocity.jar"
          tag_name: ${{ github.ref_name }}
          name: "Velocity ${{ github.ref_name }}"
          body: "Velocity proxy server build ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
